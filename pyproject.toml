[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minerva"
version = "0.1.0"
description = "Stock and Bitcoin investment analysis site"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "minerva[research]",
]
# 실시간 가상 추적(edge_paper): 연구 모델 파일을 그대로 읽는 버전으로 고정
research = [
    "numpy==2.0.2",
    "scipy==1.13.1",
    "lightgbm==4.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minerva = ["static/*", "gose_*.json", "gose_*.md"]

[tool.ruff]
line-length = 100
target-version = "py39"
# 백테스트 원자료 스크립트는 실행 당시 그대로 보관한다
extend-exclude = ["docs/backtests/raw"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
