<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Minerva</title>
  <link rel="stylesheet" href="/static/office.css">
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #14161a; --muted: #6b7280;
      --line: #e5e7eb; --accent: #2563eb; --up: #dc2626; --down: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115; --card: #181b21; --text: #e8eaed; --muted: #9aa0a6;
        --line: #2a2e36; --accent: #60a5fa; --up: #f87171; --down: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    }
    header { padding: 20px 0 12px; }
    h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
    .sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 16px; margin: 12px 0;
    }
    .card h2 { margin: 0 0 8px; font-size: 15px; color: var(--muted); font-weight: 600; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
    .row + .row { border-top: 1px solid var(--line); }
    .name { font-weight: 600; }
    .ticker { color: var(--muted); font-size: 13px; }
    .placeholder { color: var(--muted); font-size: 14px; }
    .status { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
    .dot.ok { background: #16a34a; }
    .dot.err { background: var(--up); }
    .regime { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
    .chip { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--line); }
    .chip.warn { background: #fde68a; color: #713f12; }
    .chip.good { background: #bbf7d0; color: #14532d; }
    .asset { padding: 10px 0; border-top: 1px solid var(--line); }
    .asset-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .asset .px { font-variant-numeric: tabular-nums; }
    .badge { font-size: 11px; padding: 1px 6px; border-radius: 6px; margin-left: 6px;
      border: 1px solid var(--line); color: var(--muted); }
    .state { font-size: 13px; margin-top: 4px; }
    .state.go { color: #16a34a; font-weight: 700; }
    .state.hold { color: var(--accent); font-weight: 700; }
    .detail { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .up { color: var(--up); } .down { color: var(--down); }
    footer { color: var(--muted); font-size: 12px; text-align: center; padding: 16px 0 24px; }
  </style>
</head>
<body>
  <header>
    <h1>Minerva</h1>
    <p class="sub">주식 · 비트코인 분석</p>
  </header>

  <section class="card">
    <h2>서버 상태</h2>
    <div class="status"><span id="dot" class="dot"></span><span id="status">확인 중…</span></div>
  </section>

  <section class="card" id="daily">
    <h2>📊 오늘의 전략</h2>
    <div id="daily-meta" class="placeholder">불러오는 중…</div>
    <div id="daily-list"></div>
    <p class="placeholder" id="daily-note"></p>
  </section>

  <section id="office" aria-label="Claude 작업 현황">
    <header>
      <span class="of-live" id="of-live"></span>
      <h1>🦉 MINERVA OFFICE</h1>
      <span class="of-spacer"></span>
      <span class="of-clock" id="of-clock"></span>
    </header>
    <main id="of-app">
      <section class="of-floor" id="of-floor">
        <div class="of-desks" id="of-desks"></div>
        <div class="of-door"></div>
        <div class="of-boss" id="of-boss"><div class="of-who">🧑‍💼</div><div class="of-name">사장님</div></div>
      </section>
      <aside>
        <div class="of-board">
          <h2>📋 오늘의 화이트보드</h2>
          <div class="of-stats">
            <div><b id="of-s-tools">0</b><span>도구 호출</span></div>
            <div><b id="of-s-agents">0</b><span>투입 에이전트</span></div>
            <div><b id="of-s-commits">0</b><span>커밋·푸시</span></div>
          </div>
        </div>
        <div class="of-feed"><h2>📜 작업 로그</h2><ol id="of-feed"></ol></div>
      </aside>
    </main>
    <div class="of-info" id="of-info" hidden></div>
    <section class="of-roster" id="of-roster"><h2>🪪 요원 소개</h2><div class="of-roster-list" id="of-roster-list"></div></section>
  </section>

  <footer>투자 판단의 책임은 본인에게 있습니다.</footer>

  <script>
    fetch("/api/health")
      .then((r) => r.json())
      .then((d) => {
        document.getElementById("dot").className = "dot ok";
        const t = new Date(d.server_time).toLocaleString("ko-KR", { timeZone: "Asia/Seoul" });
        document.getElementById("status").textContent = `정상 · v${d.version} · ${t}`;
      })
      .catch(() => {
        document.getElementById("dot").className = "dot err";
        document.getElementById("status").textContent = "서버 연결 실패";
      });
  </script>
  <script src="/static/daily.js"></script>
  <script src="/static/office.js"></script>
</body>
</html>
