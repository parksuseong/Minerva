<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minerva Office</title>
<style>
  :root {
    --bg: #1b1d2a; --floor-a: #2a2d40; --floor-b: #262839; --wall: #34374f;
    --desk: #8a5a3b; --desk-top: #a8714c; --screen: #0e1420; --screen-on: #3fd18b;
    --ink: #e8e9f3; --muted: #9a9cb5; --accent: #ffcf5a; --bad: #ff6b6b; --card: #23263a;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f3efe6; --floor-a: #e6dccb; --floor-b: #ded3bf; --wall: #cbbda3;
      --ink: #2b2a33; --muted: #6d6a78; --card: #fffaf0; --screen: #1d2533; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.4 "Galmuri11", "DungGeunMo", ui-monospace, Menlo, monospace; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    background: var(--wall); border-bottom: 4px solid rgba(0,0,0,.25); }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 1px; }
  .live { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .live.on { background: var(--screen-on); box-shadow: 0 0 8px var(--screen-on); }
  header .spacer { flex: 1; }
  header .clock { color: var(--muted); }
  main { display: grid; grid-template-columns: 1fr 320px; gap: 12px; padding: 12px 16px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .floor { position: relative; min-height: 420px; border: 4px solid rgba(0,0,0,.3);
    background: repeating-conic-gradient(var(--floor-a) 0 25%, var(--floor-b) 0 50%) 0 0/32px 32px;
    image-rendering: pixelated; padding: 16px; overflow: hidden; }
  .floor.night::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: rgba(10, 12, 40, .35); }
  .door { position: absolute; left: 16px; bottom: 0; width: 44px; height: 64px;
    background: #5b3b25; border: 3px solid #3b2516; border-bottom: none; }
  .door::after { content: ""; position: absolute; right: 6px; top: 30px; width: 5px; height: 5px;
    background: var(--accent); }
  .boss { position: absolute; left: 70px; bottom: 8px; text-align: center; transition: left 1.2s; }
  .boss.walk { left: 46%; }
  .desks { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center;
    padding-bottom: 80px; position: relative; z-index: 1; }
  .desk { width: 150px; text-align: center; position: relative; animation: enter .6s ease-out; }
  .desk.leaving { animation: leave 1s forwards; }
  @keyframes enter { from { transform: translateX(-60px); opacity: 0; } }
  @keyframes leave { to { transform: translateX(60px); opacity: 0; } }
  .bubble { min-height: 38px; margin: 0 auto 4px; padding: 4px 6px; max-width: 150px;
    background: var(--card); border: 2px solid var(--ink); font-size: 11px; position: relative;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; border: 6px solid transparent;
    border-top-color: var(--ink); transform: translateX(-50%); }
  .who { font-size: 34px; line-height: 1; height: 40px; }
  .working .who { animation: bob .5s steps(2) infinite; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  .sleeping .who { filter: grayscale(.6); }
  .sleeping .bubble { color: var(--muted); }
  .table { height: 34px; background: var(--desk-top); border: 3px solid var(--desk);
    border-bottom-width: 8px; position: relative; }
  .monitor { position: absolute; left: 50%; top: -26px; width: 40px; height: 26px;
    transform: translateX(-50%); background: var(--screen); border: 3px solid #555; }
  .working .monitor { background: linear-gradient(var(--screen-on) 0 0) 4px 5px/60% 2px no-repeat,
      linear-gradient(var(--screen-on) 0 0) 4px 11px/40% 2px no-repeat, var(--screen);
    animation: flicker 1s steps(2) infinite; }
  @keyframes flicker { 50% { background-size: 30% 2px, 70% 2px; } }
  .err .monitor { background: var(--bad); }
  .prop { position: absolute; right: 8px; top: -18px; font-size: 16px; }
  .name { margin-top: 4px; font-size: 12px; }
  .name small { display: block; color: var(--muted); font-size: 10px; }
  aside { display: flex; flex-direction: column; gap: 12px; }
  .board, .feed { background: var(--card); border: 4px solid rgba(0,0,0,.3); padding: 10px; }
  .board h2, .feed h2 { margin: 0 0 8px; font-size: 13px; color: var(--accent); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
  .stats b { display: block; font-size: 20px; }
  .stats span { font-size: 10px; color: var(--muted); }
  .feed ol { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow-y: auto; }
  .feed li { padding: 4px 0; border-bottom: 1px dashed rgba(127,127,127,.3); font-size: 12px;
    display: grid; grid-template-columns: 44px 22px 1fr; gap: 4px; }
  .feed li time { color: var(--muted); }
  .feed li.bad { color: var(--bad); }
  .toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); z-index: 9;
    background: var(--accent); color: #222; padding: 8px 14px; border: 3px solid #222;
    font-weight: bold; animation: toast 3s forwards; }
  @keyframes toast { 80% { opacity: 1; } to { opacity: 0; transform: translate(-50%, -20px); } }
  .locked { padding: 40px 16px; text-align: center; }
</style>
</head>
<body>
<header>
  <span class="live" id="live"></span>
  <h1>🦉 MINERVA OFFICE</h1>
  <span class="spacer"></span>
  <span class="clock" id="clock"></span>
</header>
<main id="app">
  <section class="floor" id="floor">
    <div class="desks" id="desks"></div>
    <div class="door"></div>
    <div class="boss" id="boss"><div class="who">🧑‍💼</div><div class="name">사장님</div></div>
  </section>
  <aside>
    <div class="board">
      <h2>📋 오늘의 화이트보드</h2>
      <div class="stats">
        <div><b id="s-tools">0</b><span>도구 호출</span></div>
        <div><b id="s-agents">0</b><span>투입 에이전트</span></div>
        <div><b id="s-commits">0</b><span>커밋·푸시</span></div>
      </div>
    </div>
    <div class="feed"><h2>📜 작업 로그</h2><ol id="feed"></ol></div>
  </aside>
</main>
<script>
const CAST = {
  main: ["🦉", "미네르바", "Claude 본체"],
  strategist: ["🦊", "전략가", "strategist"],
  "risk-officer": ["🐻", "리스크 담당", "risk-officer"],
  backtester: ["🐿️", "백테스터", "backtester"],
  reviewer: ["🐧", "리뷰어", "reviewer"],
  Explore: ["🐕", "탐색가", "Explore"],
  Plan: ["🦝", "설계자", "Plan"],
  "general-purpose": ["🐱", "만능 요원", "general-purpose"],
  fork: ["🦉", "분신", "fork"],
};
const TOOL_ICON = { Bash: "⌨️", Read: "📖", Edit: "✏️", Write: "📝", Grep: "🔍", Glob: "🔍",
  Agent: "📣", Task: "📣", WebFetch: "🌐", WebSearch: "🌐", Skill: "📚", reply: "💬",
  Artifact: "🖼️" };
const params = new URLSearchParams(location.search);
const token = params.get("token") || "";
const desks = new Map();   // key -> {el, state}
const pending = [];        // Agent 호출 후 아직 agent_id가 안 붙은 책상
let after = 0, stats = { tools: 0, agents: 0, commits: 0 }, failures = 0;

function cast(type) { return CAST[type] || ["🐰", type || "요원", type || ""]; }
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html; return e; }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;",
  ">": "&gt;", '"': "&quot;" }[c])); }

function desk(key, type) {
  if (desks.has(key)) return desks.get(key);
  const [emoji, name, sub] = cast(type);
  const node = el("div", "desk sleeping");
  node.innerHTML = `<div class="bubble">출근!</div><div class="who">${emoji}</div>
    <div class="table"><div class="monitor"></div><div class="prop"></div></div>
    <div class="name">${esc(name)}<small>${esc(sub)}</small></div>`;
  const d = { el: node, type, timer: null };
  key === "main" ? document.getElementById("desks").prepend(node)
                 : document.getElementById("desks").append(node);
  desks.set(key, d);
  return d;
}

function setState(d, state, text, prop) {
  d.el.classList.remove("working", "sleeping", "err");
  d.el.classList.add(state);
  if (text !== undefined) d.el.querySelector(".bubble").textContent = text;
  d.el.querySelector(".prop").textContent = prop || "";
  clearTimeout(d.timer);
  if (state === "working") d.timer = setTimeout(() => setState(d, "sleeping", "☕ 잠깐 쉬는 중", "☕"), 45000);
}

function retire(key) {
  const d = desks.get(key);
  if (!d || key === "main") return;
  setState(d, "sleeping", "✅ 보고 완료! 퇴근", "🎒");
  setTimeout(() => { d.el.classList.add("leaving"); setTimeout(() => d.el.remove(), 1000); }, 6000);
  desks.delete(key);
}

function toast(msg) { const t = el("div", "toast", esc(msg)); document.body.append(t);
  setTimeout(() => t.remove(), 3000); }

function log(ev, who, icon, text, bad) {
  const li = el("li", bad ? "bad" : "");
  const t = new Date(ev.ts * 1000).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit",
    timeZone: "Asia/Seoul", hour12: false });
  li.innerHTML = `<time>${t}</time><span>${icon}</span><span>${esc(who)} · ${esc(text)}</span>`;
  const feed = document.getElementById("feed");
  feed.prepend(li);
  while (feed.children.length > 80) feed.lastChild.remove();
}

function keyFor(ev) {
  if (!ev.agent_id) return "main";
  if (!desks.has(ev.agent_id)) {
    const i = pending.findIndex(p => p.type === ev.agent_type);
    if (i >= 0) { const p = pending.splice(i, 1)[0]; desks.set(ev.agent_id, desks.get(p.key));
      desks.delete(p.key); }
  }
  return ev.agent_id;
}

function handle(ev, live) {
  const key = keyFor(ev);
  const d = desk(key, key === "main" ? "main" : ev.agent_type);
  const who = cast(d.type)[1];
  switch (ev.event) {
    case "UserPromptSubmit": {
      const boss = document.getElementById("boss");
      if (live) { boss.classList.add("walk"); setTimeout(() => boss.classList.remove("walk"), 2500); }
      setState(d, "working", "📄 새 지시 접수!", "📄");
      log(ev, "사장님", "📄", "새 지시");
      break;
    }
    case "PreToolUse": {
      const icon = TOOL_ICON[ev.tool] || "🛠️";
      setState(d, "working", `${icon} ${ev.label || ev.tool}`);
      stats.tools++;
      if (ev.tool === "Agent" || ev.tool === "Task") {
        const pk = "pending-" + ev.seq;
        const nd = desk(pk, ev.spawn_type);
        setState(nd, "working", `🚶 ${ev.label || "출근 중"}`);
        pending.push({ key: pk, type: ev.spawn_type });
        stats.agents++;
        if (live) toast(`${cast(ev.spawn_type)[1]} 투입!`);
      }
      if (/커밋|commit|push|푸시/i.test(ev.label || "")) { stats.commits++; if (live) toast("🎉 커밋·푸시!"); }
      log(ev, who, icon, ev.label || ev.tool);
      break;
    }
    case "PostToolUse": case "PostToolUseFailure":
      if (ev.ok === false) { setState(d, "err", `❌ ${ev.label || ev.tool} 실패`);
        log(ev, who, "❌", `${ev.label || ev.tool} 실패`, true); }
      break;
    case "SubagentStart":
      desk(key, ev.agent_type); setState(desks.get(key), "working", "💼 업무 시작");
      break;
    case "SubagentStop":
      log(ev, who, "✅", "보고 완료"); retire(key);
      break;
    case "Stop":
      if (key === "main") { setState(d, "sleeping", "💤 대기 중… 다음 지시 기다리는 중", "💤");
        log(ev, who, "💤", "턴 종료"); }
      else retire(key);
      break;
    case "Notification":
      setState(d, "working", "✋ 확인이 필요해요!", "✋"); log(ev, who, "✋", "사장님 확인 요청");
      break;
    case "SessionStart":
      setState(d, "sleeping", "☀️ 출근 완료"); log(ev, who, "☀️", "세션 시작");
      break;
  }
  for (const k of Object.keys(stats)) document.getElementById("s-" + k).textContent = stats[k];
}

async function poll(first) {
  try {
    const r = await fetch(`/api/office/events?after=${after}&token=${encodeURIComponent(token)}`);
    if (r.status === 403) {
      document.getElementById("app").innerHTML =
        '<div class="locked">🔒 토큰이 필요해요. 주소 끝에 ?token=... 을 붙여 주세요.</div>';
      return;
    }
    const data = await r.json();
    if (data.last < after) after = 0;
    for (const ev of data.events) handle(ev, !first);
    after = data.last;
    document.getElementById("live").classList.add("on");
    failures = 0;
  } catch (e) {
    document.getElementById("live").classList.remove("on");
    failures++;
  }
  setTimeout(() => poll(false), failures ? 5000 : 1500);
}

function tick() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleString("ko-KR", { timeZone: "Asia/Seoul", hour12: false, month: "numeric",
      day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const h = Number(now.toLocaleString("en-US", { timeZone: "Asia/Seoul", hour: "numeric", hour12: false }));
  document.getElementById("floor").classList.toggle("night", h >= 19 || h < 7);
}

desk("main", "main");
setInterval(tick, 1000); tick();
poll(true);
</script>
</body>
</html>
